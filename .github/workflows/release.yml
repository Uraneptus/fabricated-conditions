name: Deploy Release to Maven

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository (default branch)
      - name: Checkout code
        uses: actions/checkout@v4

      # Make Gradle wrapper executable
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Set up JDK
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      # Cache Gradle dependencies
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set environment variables
        run: | 
          echo "AUTH_KEY_SECRET=${{ secrets.AUTH_KEY_SECRET }}" >> $GITHUB_ENV
          echo "MM_MAVEN_URL=https://maven.mosaicmodding.com/release/" >> $GITHUB_ENV

      # Build mod files
      - name: Build with Gradle
        run: ./gradlew build

      # Get path of mod files
      - name: Calculate artifact names
        id: calculate_artifact_names
        run: |
          VERSION=$(awk -F '=' '/^mod_version/ { print $2; }' gradle.properties | xargs)
          MC_VERSION=$(awk -F '=' '/^minecraft_version/ { print $2; }' gradle.properties | xargs)
          echo "neoforge=build/libs/fabricatedconditions-${MC_VERSION}-${VERSION}.jar" >> "$GITHUB_OUTPUT"

      # Build and publish Neoforge to maven
      - name: Publish Neoforge
        run: ./gradlew :publish
